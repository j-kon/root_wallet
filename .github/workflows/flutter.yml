name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  analyze-test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Lock bdk-dart dependencies
        run: |
          for dir in ~/.pub-cache/git/bdk-dart-*/native; do
            if [ -d "$dir" ]; then
              echo "Restoring verified Cargo.lock into $dir"
              cp tool/ci/bdk_dart_Cargo.lock "$dir/Cargo.lock"
            fi
          done

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Security Tests
        run: flutter test --no-pub test/security/

      - name: Test
        run: flutter test --no-pub --exclude-tags golden
